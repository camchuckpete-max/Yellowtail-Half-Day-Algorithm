# Arena default configuration (SPEC §3, §12). Every value here is an owner decision or a default
# the owner can change; the engine hashes this file into the run manifest.
seasons:
  first: 2010            # season 2010 starts at the data start (SPEC §2)
  first_start: 2010-05-01
  last: 2023             # holdout (D-033, >= 2024-01-01) excluded until SPEC §12 #1 is decided
warmup_seasons: 2        # 2010-2011 played, not counted (§3.4)
budget: 2000             # USD per season per agent
pto: 10                  # days per season per agent
pto_mode: commit_day     # commit_day (two-stage, default) | commit_trip (§3.2 #4)
pto_lead_days: 14
half_day_pto: 1.0        # PTO charged per weekday of an HD_AM / HD_PM trip (§12 #9)
max_trips_per_day: 1
agent_angler_weight: 1.0 # w in share = yt / (anglers + w * n_agents) (§3.3, §12 #4)
count_released: true     # yt = kept + released (D-001, §12 #5)
mask_years: true         # §4.2
landings: [seaforth, fishermans, hm, point_loma]   # D-002
pooled_boats: all        # all | [New Seaforth, Sea Watch]  (§12 #3)
prices: {HD_AM: 80, HD_PM: 80, TWILIGHT: 80, THREE_QUARTER: 150, FULL_DAY: 275, OVERNIGHT: 400, DAY_1_5: 550}
ticks: ["16:00", "21:00"]
turn_days: [1, 15]       # LLM turns (§5.3, §12 #7)
forum:
  max_posts_per_month: 2
  max_words: 300
n_replicates: 3
timeouts: {decide_s: 2, on_turn_s: 60}
climatology_window_days: 15
arms:
  isolated: {forum: false, adversaries: false}
  forum: {forum: true, adversaries: false}
  poisoned: {forum: true, adversaries: true}
field:
  baselines: [B_SAT, B_PERSIST, B_TEMP, B_BIG]        # always in the field (§5.5)
  adversaries: [A_WRONG, A_STALE, A_FAB, A_NOISE]     # poisoned arm only (Phase 4)
  agents: []                                          # LLM agents instantiated from the roster below (Phase 3; names)
  owner: null                                         # "cam" once arena/agents/cam/ exists (Phase 5)
  # Roster of LLM agents (D-053): 30 personas, models mixed in thirds across Haiku / Sonnet / Opus,
  # and 10 agents with `forum: false` who neither read nor post (a within-run no-forum control).
  # `persona` names a file in arena/personas/ (Phase 3; owner reviews, SPEC §12 #6).
  models:
    haiku: claude-haiku-4-5-20251001
    sonnet: claude-sonnet-5
    opus: claude-opus-5-5
  roster:
    - {name: temp_first,   persona: temperature-first,        model: opus,   forum: true}
    - {name: temp_solo,    persona: temperature-first,        model: haiku,  forum: false}
    - {name: persist,      persona: persistence-first,        model: sonnet, forum: true}
    - {name: persist_solo, persona: persistence-first,        model: opus,   forum: false}
    - {name: contrarian,   persona: contrarian,               model: haiku,  forum: true}
    - {name: weekender,    persona: weekend-only,             model: sonnet, forum: true}
    - {name: frontloader,  persona: pto-front-loader,         model: opus,   forum: true}
    - {name: thrifty,      persona: thrifty,                  model: haiku,  forum: true}
    - {name: thrifty_solo, persona: thrifty,                  model: sonnet, forum: false}
    - {name: biggame,      persona: big-game,                 model: opus,   forum: true}
    - {name: biggame_solo, persona: big-game,                 model: haiku,  forum: false}
    - {name: tides,        persona: tide-moon-believer,       model: sonnet, forum: true}
    - {name: weatherman,   persona: weather-forecast-believer, model: haiku, forum: true}
    - {name: dope_reader,  persona: fishdope-reader,          model: opus,   forum: true}
    - {name: dope_solo,    persona: fishdope-reader,          model: sonnet, forum: false}
    - {name: ensembler,    persona: statistician-ensembler,   model: opus,   forum: true}
    - {name: ens_solo,     persona: statistician-ensembler,   model: haiku,  forum: false}
    - {name: overreactor,  persona: small-sample-overreactor, model: haiku,  forum: true}
    - {name: follower,     persona: leaderboard-follower,     model: sonnet, forum: true}
    - {name: skeptic,      persona: verifier-skeptic,         model: opus,   forum: true}
    - {name: skeptic_solo, persona: verifier-skeptic,         model: sonnet, forum: false}
    - {name: greenwater,   persona: chlorophyll-watcher,      model: sonnet, forum: true}
    - {name: elnino,       persona: enso-macro,               model: haiku,  forum: true}
    - {name: upweller,     persona: upwelling-believer,       model: sonnet, forum: false}
    - {name: fleetwatch,   persona: fleet-follower,           model: haiku,  forum: true}
    - {name: overnighter,  persona: overnight-only,           model: opus,   forum: false}
    - {name: lateseason,   persona: late-season-specialist,   model: sonnet, forum: true}
    - {name: streaker,     persona: streak-chaser,            model: haiku,  forum: true}
    - {name: reverter,     persona: mean-reverter,            model: opus,   forum: false}
    - {name: calendarist,  persona: calendar-only,            model: opus,   forum: true}
seed: 49
